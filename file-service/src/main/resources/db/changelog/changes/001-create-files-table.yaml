databaseChangeLog:
  - changeSet:
      id: create-files-table
      author: whatever125
      changes:
        - createTable:
            tableName: files
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: task_id, type: BIGSERIAL, constraints: { nullable: false } }
              - column: { name: uuid, type: UUID, constraints: { unique: true, nullable: false } }
              - column: { name: original_filename, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: content_type, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: uploaded_by, type: BIGINT, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMPTZ, constraints: { nullable: false }, defaultValueComputed: CURRENT_TIMESTAMP }